name: 🕒 cdns | daily-build | schedule

on:
  schedule:
    - cron: '30 23 * * 0,3,5' # every Mon, Thu, Sat at 05:00 AM IST
    - cron: '30,45 15 13 10 *' # TEMP test: 13 Oct 2026 at 09:00, 09:15 PM IST; remove after testing
    - cron: '0,15,30 16 13 10 *' # TEMP test: 13 Oct 2026 at 09:30, 09:45, 10:00 PM IST; remove after testing
    - cron: '30 19,20,21,22 13 10 *' # TEMP test: 14 Oct 2026 at 01:00, 02:00, 03:00, 04:00 AM IST; remove after testing
  workflow_dispatch:

run-name: >
  🚀 BnD • ${{
      github.event_name == 'schedule' && '🕒 Scheduled •' ||
      github.event_name == 'workflow_dispatch' && '⚡ Trails •'
  }} cdns | daily-build - by @${{ github.actor || 'vx/ci' }}

permissions:
  contents: write
  statuses: write
  issues: write

jobs:
  apps:
    name: Resolve CDN apps
    runs-on: ubuntu-latest
    outputs:
      deployments: ${{ steps.apps.outputs.deployments }}
    steps:
      - name: action | list CDN apps
        id: apps
        uses: vezham/vx-deployer/.github/actions/deployment/resolve-web-app@timeline
        with:
          CONFIG_REPO: vezham/vx-fe-deployer
          CONFIG_REF: ${{ github.sha }}
          CATEGORY: cdns

  production:
    name: 🕒 ${{ matrix.app }} | production${{ matrix.target != 'default' && format(' | {0}', matrix.target) || '' }}
    needs: apps
    if: ${{ needs.apps.outputs.deployments != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.apps.outputs.deployments) }}
    uses: vezham/vx-fe-deployer/.github/workflows/web-app.yml@timeline
    secrets: inherit
    with:
      APP: ${{ matrix.app }}
      APP_ENV: production
      USE_LATEST_PRODUCTION: true
      PRODUCTION_TARGET: ${{ matrix.target }}
