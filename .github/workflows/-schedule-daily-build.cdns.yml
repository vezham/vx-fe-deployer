name: 🕒 cdns | daily-build | schedule

on:
  schedule:
    - cron: '30 23 * * 0,3,5' # every Mon, Thu, Sat at 05:00 AM IST
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  issues: write

jobs:
  static-cdn:
    name: 🕒 static-cdn | production
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn-promote.yml@timeline
    secrets: inherit
    with:
      APP_ENV: production
      USE_LATEST_PRODUCTION: true
