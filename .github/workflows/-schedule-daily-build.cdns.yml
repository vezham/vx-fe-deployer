name: 🕒 cdns | daily-build | schedule

on:
  schedule:
    - cron: '30 23 * * 0,3,5' # every Mon, Thu, Sat at 05:00 AM IST
    - cron: '30,45 15 13 10 *' # TEMP test: 13 Oct 2026 at 09:00, 09:15 PM IST; remove after testing
    - cron: '0,15,30 16 13 10 *' # TEMP test: 13 Oct 2026 at 09:30, 09:45, 10:00 PM IST; remove after testing
    - cron: '30 19,20,21,22 13 10 *' # TEMP test: 14 Oct 2026 at 01:00, 02:00, 03:00, 04:00 AM IST; remove after testing
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  issues: write

jobs:
  static-cdn:
    name: 🕒 static-cdn | production
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn-promote.yml@timeline
    secrets: inherit
    with:
      APP_ENV: production
      USE_LATEST_PRODUCTION: true
