name: books | deployer

on:
  workflow_call:
    inputs:
      CALLER:
        required: true
        type: string

jobs:
  tva:
    name: dc/TVA
    if: ${{ inputs.CALLER == 'timeline' || inputs.CALLER == 'feat/app-books' || inputs.CALLER == 'scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/apps-books.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.APPS_BOOKS_TVA_GCP_SA_KEY }}
    with:
      GIT_BRANCH: ${{ inputs.CALLER }}
      APP_ENV: dev
      RELEASE_CHANNEL: beta
      IS_DEBUG: true
      APP_NAME: books

  dev:
    name: dc/dev
    if: ${{ inputs.CALLER == 'deploy/dev' || inputs.CALLER == '-scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/apps-books.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.APPS_BOOKS_DEV_GCP_SA_KEY }}
    with:
      GIT_BRANCH: deploy/dev
      APP_ENV: dev
      RELEASE_CHANNEL: beta
      IS_DEBUG: true
      APP_NAME: books

  qa:
    name: dc/qa
    if: ${{ inputs.CALLER == 'deploy/qa' || inputs.CALLER == '-scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/apps-books.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.APPS_BOOKS_QA_GCP_SA_KEY }}
    with:
      GIT_BRANCH: deploy/qa
      APP_ENV: qa
      RELEASE_CHANNEL: beta
      APP_NAME: books

  preview:
    name: dc/preview
    if: ${{ inputs.CALLER == 'deploy/preview' || inputs.CALLER == '-scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/apps-books.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.APPS_BOOKS_PREVIEW_GCP_SA_KEY }}
    with:
      GIT_BRANCH: deploy/preview
      APP_ENV: preview
      RELEASE_CHANNEL: stable
      APP_NAME: books

  live:
    name: dc/live
    if: ${{ inputs.CALLER == 'deploy/live' || inputs.CALLER == '-scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/apps-books.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.APPS_BOOKS_LIVE_GCP_SA_KEY }}
    with:
      GIT_BRANCH: deploy/live
      APP_ENV: production
      RELEASE_CHANNEL: stable
      APP_NAME: books
