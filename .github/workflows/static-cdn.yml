name: static-cdn | deployer

on:
  workflow_call:
    inputs:
      CALLER:
        required: true
        type: string

jobs:
  tva:
    name: tva | dc
    if: ${{ inputs.CALLER == 'timeline' || inputs.CALLER == '-scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn.helper.yml@timeline
    secrets:
      # GCP_SA_KEY: ${{ secrets.STATIC_CDN_TVA_GCP_SA_KEY }}
      GCP_SA_KEY: ${{ secrets.PLAYGROUND_DOCS_TVA_GCP_SA_KEY }}
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    with:
      GIT_BRANCH: ${{ inputs.CALLER }}
      APP_ENV: dev
      RELEASE_CHANNEL: beta
      IS_DEBUG: true
      APP_NAME: static-cdn
