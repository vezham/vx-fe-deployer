name: playbook | deployer

on:
  workflow_call:
    inputs:
      CALLER:
        required: true
        type: string

jobs:
  tva:
    name: dc/TVA
    if: ${{ inputs.CALLER == 'timeline' || inputs.CALLER == 'feat/playbook' || inputs.CALLER == 'scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/playbook.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.PLAYBOOK_TVA_GCP_SA_KEY }}
    with:
      GIT_BRANCH: ${{ inputs.CALLER }}
      APP_ENV: dev
      RELEASE_CHANNEL: beta
      IS_DEBUG: true
      APP_NAME: playbook
      BASE_API_URL: mock
      MOCK_API_URL: https://dev.playbook.mock.vezham.com
      APP_API_URL: https://dev.api.vezham.com

  dev:
    name: dc/dev
    if: ${{ inputs.CALLER == 'deploy/dev' || inputs.CALLER == '-scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/playbook.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.PLAYBOOK_DEV_GCP_SA_KEY }}
    with:
      GIT_BRANCH: deploy/dev
      APP_ENV: dev
      RELEASE_CHANNEL: beta
      IS_DEBUG: true
      APP_NAME: playbook
      BASE_API_URL: mock
      MOCK_API_URL: https://dev.playbook.mock.vezham.com
      APP_API_URL: https://dev.api.vezham.com

  qa:
    name: dc/qa
    if: ${{ inputs.CALLER == 'deploy/qa' || inputs.CALLER == '-scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/playbook.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.PLAYBOOK_QA_GCP_SA_KEY }}
    with:
      GIT_BRANCH: deploy/qa
      APP_ENV: qa
      RELEASE_CHANNEL: beta
      APP_NAME: playbook
      BASE_API_URL: mock
      MOCK_API_URL: https://dev.playbook.mock.vezham.com
      APP_API_URL: https://dev.api.vezham.com

  preview:
    name: dc/preview
    if: ${{ inputs.CALLER == 'deploy/preview' || inputs.CALLER == '-scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/playbook.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.PLAYBOOK_PREVIEW_GCP_SA_KEY }}
    with:
      GIT_BRANCH: deploy/preview
      APP_ENV: preview
      RELEASE_CHANNEL: stable
      APP_NAME: playbook
      BASE_API_URL: mock
      MOCK_API_URL: https://dev.playbook.mock.vezham.com
      APP_API_URL: https://dev.api.vezham.com

  live:
    name: dc/live
    if: ${{ inputs.CALLER == 'deploy/live' || inputs.CALLER == '-scheduler' }}
    uses: vezham/vx-fe-deployer/.github/workflows/playbook.helper.yml@timeline
    secrets:
      GCP_SA_KEY: ${{ secrets.PLAYBOOK_LIVE_GCP_SA_KEY }}
    with:
      GIT_BRANCH: deploy/live
      APP_ENV: production
      RELEASE_CHANNEL: stable
      APP_NAME: playbook
      BASE_API_URL: mock
      MOCK_API_URL: https://dev.playbook.mock.vezham.com
      APP_API_URL: https://dev.api.vezham.com
