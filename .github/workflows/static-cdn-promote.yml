name: static-cdn | promote deployer

on:
  workflow_call:
    inputs:
      GIT_SHA:
        description: Full source commit SHA; omit when rebuilding the latest production deployment
        required: false
        type: string
      APP_ENV:
        description: Destination environment (dev, qa, preview or production)
        required: true
        type: string
      USE_LATEST_PRODUCTION:
        description: Rebuild the latest successful Production SHA recorded in the deployment journal
        type: boolean
        default: false

permissions:
  contents: write
  statuses: write
  issues: write

concurrency:
  group: static-cdn-promote-${{ github.repository }}-${{ inputs.APP_ENV }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
    steps:
      - name: Validate deployment source selection
        shell: bash
        env:
          USE_LATEST_PRODUCTION: ${{ inputs.USE_LATEST_PRODUCTION }}
          SOURCE_SHA: ${{ inputs.GIT_SHA }}
          TARGET_ENV: ${{ inputs.APP_ENV }}
        run: |
          if [ "$USE_LATEST_PRODUCTION" = "true" ]; then
            if [ "$TARGET_ENV" != "production" ] || [ -n "$SOURCE_SHA" ]; then
              echo "::error::USE_LATEST_PRODUCTION requires APP_ENV=production and no GIT_SHA."
              exit 1
            fi
          elif [ -z "$SOURCE_SHA" ]; then
            echo "::error::GIT_SHA is required for manual promotion."
            exit 1
          fi

      - name: action | read latest production deployment
        id: production
        if: ${{ inputs.USE_LATEST_PRODUCTION }}
        uses: vezham/vx-deployer/.github/actions/deployment/read-deployment-journal@timeline
        with:
          JOURNAL_REPO: ${{ github.repository }}
          GIT_REPO: vezham/vx-fe-apps-cdns
          APP_NAME: static-cdn
          APP_ENV: production
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summarize scheduled production selection
        if: ${{ inputs.USE_LATEST_PRODUCTION }}
        uses: actions/github-script@v7
        env:
          PRODUCTION_FOUND: ${{ steps.production.outputs.found }}
          SOURCE_SHA: ${{ steps.production.outputs.sha }}
          JOURNAL_URL: ${{ steps.production.outputs.issue_url }}
          ENTRY_URL: ${{ steps.production.outputs.entry_url }}
        with:
          script: |
            core.summary.addHeading('Scheduled production rebuild | static-cdn');
            if (process.env.PRODUCTION_FOUND === 'true') {
              core.summary.addRaw(`Rebuilding the latest successful Production SHA: \`${process.env.SOURCE_SHA}\`\n`);
              core.summary.addLink('Successful deployment entry', process.env.ENTRY_URL);
            } else {
              core.summary.addRaw('Skipped: no successful Production deployment is recorded.\n');
            }
            if (process.env.JOURNAL_URL) core.summary.addLink('Deployment journal', process.env.JOURNAL_URL);
            await core.summary.write();

      - name: action | authenticate source repository
        id: source-auth
        if: ${{ !inputs.USE_LATEST_PRODUCTION || steps.production.outputs.found == 'true' }}
        uses: vezham/vx-deployer/.github/actions/common/setup-source-auth@timeline
        with:
          GIT_REPO: vezham/vx-fe-apps-cdns
          APP_CLIENT_ID: ${{ vars.SOURCE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}

      - name: action | validate promotion
        id: commit
        if: ${{ !inputs.USE_LATEST_PRODUCTION || steps.production.outputs.found == 'true' }}
        uses: vezham/vx-deployer/.github/actions/deployment/validate-promotion@timeline
        with:
          GIT_REPO: vezham/vx-fe-apps-cdns
          GITHUB_TOKEN: ${{ steps.source-auth.outputs.token }}
          GIT_SHA: ${{ inputs.USE_LATEST_PRODUCTION && steps.production.outputs.sha || inputs.GIT_SHA }}
          APP_ENV: ${{ inputs.APP_ENV }}
          APP_NAME: static-cdn

  dev:
    name: dev | dc
    needs: validate
    if: ${{ inputs.APP_ENV == 'dev' && needs.validate.outputs.sha != '' }}
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn.helper.yml@timeline
    secrets:
      # GCP_SA_KEY: ${{ secrets.STATIC_CDN_DEV_GCP_SA_KEY }}
      GCP_SA_KEY: ${{ secrets.PLAYGROUND_DOCS_TVA_GCP_SA_KEY }}
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
    with:
      GIT_BRANCH: ${{ needs.validate.outputs.sha }}
      IS_PROMOTION: true
      APP_ENV: dev
      RELEASE_CHANNEL: beta
      IS_DEBUG: true
      APP_NAME: static-cdn

  qa:
    name: qa | dc
    needs: validate
    if: ${{ inputs.APP_ENV == 'qa' && needs.validate.outputs.sha != '' }}
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn.helper.yml@timeline
    secrets:
      # GCP_SA_KEY: ${{ secrets.STATIC_CDN_QA_GCP_SA_KEY }}
      GCP_SA_KEY: ${{ secrets.PLAYGROUND_DOCS_TVA_GCP_SA_KEY }}
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
    with:
      GIT_BRANCH: ${{ needs.validate.outputs.sha }}
      IS_PROMOTION: true
      APP_ENV: qa
      RELEASE_CHANNEL: beta
      IS_DEBUG: false
      APP_NAME: static-cdn

  preview:
    name: preview | dc
    needs: validate
    if: ${{ inputs.APP_ENV == 'preview' && needs.validate.outputs.sha != '' }}
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn.helper.yml@timeline
    secrets:
      # GCP_SA_KEY: ${{ secrets.STATIC_CDN_PREVIEW_GCP_SA_KEY }}
      GCP_SA_KEY: ${{ secrets.PLAYGROUND_DOCS_TVA_GCP_SA_KEY }}
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
    with:
      GIT_BRANCH: ${{ needs.validate.outputs.sha }}
      IS_PROMOTION: true
      APP_ENV: preview
      RELEASE_CHANNEL: stable
      IS_DEBUG: false
      APP_NAME: static-cdn

  production:
    name: production | dc
    needs: validate
    if: ${{ inputs.APP_ENV == 'production' && needs.validate.outputs.sha != '' }}
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn.helper.yml@timeline
    secrets:
      # GCP_SA_KEY: ${{ secrets.STATIC_CDN_LIVE_GCP_SA_KEY }}
      GCP_SA_KEY: ${{ secrets.PLAYGROUND_DOCS_TVA_GCP_SA_KEY }}
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
    with:
      GIT_BRANCH: ${{ needs.validate.outputs.sha }}
      IS_PROMOTION: true
      APP_ENV: production
      RELEASE_CHANNEL: stable
      IS_DEBUG: false
      APP_NAME: static-cdn
