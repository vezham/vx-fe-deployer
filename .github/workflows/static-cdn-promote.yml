name: static-cdn | promote deployer

on:
  workflow_call:
    inputs:
      GIT_SHA:
        description: Full source commit SHA in the caller repository
        required: true
        type: string
      APP_ENV:
        description: dev, qa, preview or production
        required: true
        type: string

concurrency:
  group: static-cdn-promote-${{ github.repository }}-${{ inputs.APP_ENV }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: action | validate promotion
        id: commit
        uses: vezham/vx-deployer/.github/actions/deployment/validate-promotion@timeline
        with:
          GIT_REPO: ${{ github.repository }}
          GIT_SHA: ${{ inputs.GIT_SHA }}
          APP_ENV: ${{ inputs.APP_ENV }}

  dev:
    name: dev | dc
    needs: validate
    if: ${{ inputs.APP_ENV == 'dev' }}
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn.helper.yml@timeline
    secrets:
      # GCP_SA_KEY: ${{ secrets.STATIC_CDN_DEV_GCP_SA_KEY }}
      GCP_SA_KEY: ${{ secrets.PLAYGROUND_DOCS_TVA_GCP_SA_KEY }}
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    with:
      GIT_REPO: ${{ github.repository }}
      GIT_BRANCH: ${{ needs.validate.outputs.sha }}
      APP_ENV: dev
      RELEASE_CHANNEL: beta
      IS_DEBUG: true
      APP_NAME: static-cdn

  qa:
    name: qa | dc
    needs: validate
    if: ${{ inputs.APP_ENV == 'qa' }}
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn.helper.yml@timeline
    secrets:
      # GCP_SA_KEY: ${{ secrets.STATIC_CDN_QA_GCP_SA_KEY }}
      GCP_SA_KEY: ${{ secrets.PLAYGROUND_DOCS_TVA_GCP_SA_KEY }}
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    with:
      GIT_REPO: ${{ github.repository }}
      GIT_BRANCH: ${{ needs.validate.outputs.sha }}
      APP_ENV: qa
      RELEASE_CHANNEL: beta
      IS_DEBUG: false
      APP_NAME: static-cdn

  preview:
    name: preview | dc
    needs: validate
    if: ${{ inputs.APP_ENV == 'preview' }}
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn.helper.yml@timeline
    secrets:
      # GCP_SA_KEY: ${{ secrets.STATIC_CDN_PREVIEW_GCP_SA_KEY }}
      GCP_SA_KEY: ${{ secrets.PLAYGROUND_DOCS_TVA_GCP_SA_KEY }}
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    with:
      GIT_REPO: ${{ github.repository }}
      GIT_BRANCH: ${{ needs.validate.outputs.sha }}
      APP_ENV: preview
      RELEASE_CHANNEL: stable
      IS_DEBUG: false
      APP_NAME: static-cdn

  production:
    name: production | dc
    needs: validate
    if: ${{ inputs.APP_ENV == 'production' }}
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn.helper.yml@timeline
    secrets:
      # GCP_SA_KEY: ${{ secrets.STATIC_CDN_LIVE_GCP_SA_KEY }}
      GCP_SA_KEY: ${{ secrets.PLAYGROUND_DOCS_TVA_GCP_SA_KEY }}
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    with:
      GIT_REPO: ${{ github.repository }}
      GIT_BRANCH: ${{ needs.validate.outputs.sha }}
      APP_ENV: production
      RELEASE_CHANNEL: stable
      IS_DEBUG: false
      APP_NAME: static-cdn
