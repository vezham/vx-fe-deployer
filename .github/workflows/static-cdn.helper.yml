name: static-cdn | helper

on:
  workflow_call:
    secrets:
      SOURCE_REPO_TOKEN:
        required: false
      GCP_SA_KEY:
        required: true
      HEROUI_AUTH_TOKEN:
        required: true
    inputs:
      GIT_REPO:
        required: false
        type: string
      GIT_BRANCH:
        required: false
        type: string
      APP_ENV:
        required: true
        type: string
      RELEASE_CHANNEL:
        required: false
        type: string
        default: stable
      IS_DEBUG:
        required: false
        type: boolean
        default: false
      IS_PROMOTION:
        description: Track the destination environment; non-promotion builds track TVA
        type: boolean
        default: false
      APP_NAME:
        type: string
      # @vx/NOTE: custom-fields

env:
  REPO: ${{ inputs.GIT_REPO || 'vezham/vx-fe-apps-cdns' }}
  BRANCH: ${{ inputs.GIT_BRANCH || 'timeline' }}
  ENTRY_POINT: ./apps-cdns/static-cdn
  VX_APP_PATH: apps-cdns/static-cdn
  VX_APP_NAME: static-cdn

jobs:
  bnd:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.ENTRY_POINT }}

    steps:
      - name: Validate deployment settings
        uses: vezham/vx-deployer/.github/actions/deployment/validate@timeline
        with:
          APP_ENV: ${{ inputs.APP_ENV }}
          RELEASE_CHANNEL: ${{ inputs.RELEASE_CHANNEL }}

      - name: action | checkout | ${{ env.REPO }}@${{ env.BRANCH }}
        uses: vezham/vx-deployer/.github/actions/common/setup-checkout@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_BRANCH: ${{ env.BRANCH }}
          GIT_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      - name: Resolve deployed source SHA
        id: source
        shell: bash
        working-directory: ${{ github.workspace }}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: action | track deployment started
        continue-on-error: true
        uses: vezham/vx-deployer/.github/actions/deployment/comment-promotion@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_SHA: ${{ steps.source.outputs.sha }}
          APP_NAME: ${{ env.VX_APP_NAME }}
          APP_ENV: ${{ inputs.IS_PROMOTION && inputs.APP_ENV || 'tva' }}
          STATUS: in_progress
          GITHUB_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      - name: action | gen $DX_APP_URL
        uses: vezham/vx-deployer/.github/actions/common/gen-dx-app-url@timeline

      - name: setup | .env vars
        uses: SpicyPizza/create-envfile@v1.3
        with:
          directory: ${{ env.ENTRY_POINT }}
          envkey_V_APP_NAME: ${{ inputs.APP_NAME }}
          envkey_V_APP_ENV: ${{ inputs.APP_ENV }}
          envkey_V_RELEASE_CHANNEL: ${{ inputs.RELEASE_CHANNEL }}
          envkey_V_IS_DEBUG: ${{ inputs.IS_DEBUG }}

      - name: 🟠 · 🧩 Setup Node & pnpm
        uses: vezham/vx-deployer/.github/actions/common/setup-install@timeline
        with:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: action | gen-build
        uses: vezham/vx-deployer/.github/actions/nx/gen-build@timeline

      - name: action | ci-setup | firebase
        uses: vezham/vx-deployer/.github/actions/cloud-providers/firebase@timeline
        with:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: action | track deployment result
        if: ${{ always() && (steps.source.outputs.sha != '' || inputs.IS_PROMOTION) }}
        continue-on-error: true
        uses: vezham/vx-deployer/.github/actions/deployment/comment-promotion@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_SHA: ${{ steps.source.outputs.sha || inputs.GIT_BRANCH }}
          APP_NAME: ${{ env.VX_APP_NAME }}
          APP_ENV: ${{ inputs.IS_PROMOTION && inputs.APP_ENV || 'tva' }}
          STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
