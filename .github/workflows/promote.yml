name: 🚀 Promote

run-name: 🚀 Promote • ⚡ Trails • ${{ inputs.APP }} | ${{ inputs.APP_ENV }}${{ inputs.APP_ENV == 'production' && (inputs.PRODUCTION_TARGET != '' && format(' | {0}', inputs.PRODUCTION_TARGET) || ' | all targets') || '' }} | ${{ inputs.GIT_SHA }} - by @${{ github.actor || 'vx/ci' }}

on:
  workflow_dispatch:
    inputs:
      GIT_SHA:
        description: Full 40-character commit SHA in the selected app's source repository
        required: true
        type: string
      APP:
        description: Application ID from .github/config/web-apps.yaml
        required: true
        # vx-bot/INFO: Generated app choices from web-apps.yaml; do not edit.
        type: choice
        options:
          - academy
          - accounts
          - blogs
          - books
          - business
          - chat-widget
          - demo
          - help-center
          - home
          - hq
          - iam
          - one
          - playbook
          - playground
          - playground-app
          - playground-cdn
          - playground-docs
          - policy-center
          - static-cdn
          - storybook
          - storybook-sb
          - whats-new
        # vx-bot/INFO: End generated app choices.
      APP_ENV:
        description: Destination environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - preview
          - production
      PRODUCTION_TARGET:
        description: 'Production only: enter one target, or leave empty to promote all configured targets'
        type: string
        required: false

permissions:
  contents: write
  statuses: write
  issues: write
  actions: read

jobs:
  resolve:
    name: 🔎 Resolve promotion targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.app.outputs.promotion_targets }}
    steps:
      - name: 🟠 · 🔎 Resolve app promotion targets
        id: app
        uses: vezham/vx-deployer/.github/actions/deployment/resolve-web-app@timeline
        with:
          CONFIG_REPO: vezham/vx-fe-deployer
          CONFIG_REF: ${{ github.sha }}
          APP: ${{ inputs.APP }}
          APP_ENV: ${{ inputs.APP_ENV }}
          PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
          EXPAND_PROMOTION_TARGETS: 'true'

  promote:
    name: 🚀 Promote • ${{ inputs.APP }} | ${{ inputs.APP_ENV }}${{ matrix.target != '' && matrix.target != 'default' && format(' | {0}', matrix.target) || '' }}
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    uses: ./.github/workflows/web-app.yml
    secrets: inherit
    with:
      GIT_SHA: ${{ inputs.GIT_SHA }}
      APP: ${{ inputs.APP }}
      APP_ENV: ${{ inputs.APP_ENV }}
      PRODUCTION_TARGET: ${{ matrix.target }}
