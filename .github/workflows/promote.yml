name: 🚀 Promote
run-name: Promote ${{ inputs.APP }} | ${{ inputs.APP_ENV }}${{ inputs.PRODUCTION_TARGET != '' && format(' | {0}', inputs.PRODUCTION_TARGET) || '' }} | ${{ inputs.GIT_SHA }}

on:
  workflow_dispatch:
    inputs:
      GIT_SHA:
        description: Full 40-character commit SHA in the selected app's source repository
        required: true
        type: string
      APP:
        description: Application ID from .github/config/web-apps.yaml
        required: true
        # vx-bot/INFO: Generated app choices from web-apps.yaml; do not edit.
        type: choice
        options:
          - academy
          - accounts
          - blogs
          - books
          - business
          - chat-widget
          - demo
          - help-center
          - home
          - hq
          - iam
          - one
          - playbook
          - playground
          - playground-app
          - playground-cdn
          - playground-docs
          - policy-center
          - static-cdn
          - storybook
          - storybook-sb
          - whats-new
        # vx-bot/INFO: End generated app choices.
      APP_ENV:
        description: Destination environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - preview
          - production
      PRODUCTION_TARGET:
        description: Production target from this app’s production_targets; leave empty for single Production
        type: string
        required: false

permissions:
  contents: write
  statuses: write
  issues: write
  actions: read

jobs:
  promote:
    name: ${{ inputs.APP }} | promote
    uses: ./.github/workflows/web-app.yml
    secrets: inherit
    with:
      GIT_SHA: ${{ inputs.GIT_SHA }}
      APP: ${{ inputs.APP }}
      APP_ENV: ${{ inputs.APP_ENV }}
      PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
