name: Check promotion choices

run-name: >
  🧭 Promotion choices • ${{
    github.event_name == 'workflow_dispatch' && '⚡ Trails' ||
    github.event_name == 'pull_request' && '🔀 PR' ||
    '📤 Push'
  }} - by @${{ github.actor || 'vx/ci' }}

on:
  pull_request:
    paths:
      - .github/config/web-apps.yaml
      - .github/workflows/promote*.yml
  push:
    branches:
      - timeline
    paths:
      - .github/config/web-apps.yaml
      - .github/workflows/promote*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 🧭 Check promotion app choices
    runs-on: ubuntu-latest
    steps:
      - name: 🟠 · 🧰 Checkout registry
        uses: actions/checkout@v4
      - name: 🟠 · 🧭 Check generated promotion choices
        uses: vezham/vx-deployer/.github/actions/deployment/sync-promote-choices@timeline
        with:
          ALL_CATEGORIES: 'true'
