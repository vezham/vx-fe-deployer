# yaml-language-server: $schema=../../vx/schemas/web-apps.json
schema: 2
defaults:
  schedule:
    frequency: weekly
    days: [mon, thu, sat]
  environments:
    tva:
      build_environment: dev
      release_channel: beta
      debug: true
    dev:
      build_environment: dev
      release_channel: beta
      debug: true
    qa:
      build_environment: qa
      release_channel: beta
      debug: false
    preview:
      build_environment: preview
      release_channel: stable
      debug: false
    production:
      build_environment: production
      release_channel: stable
      debug: false

# vx-bot/NOTE: Migration entries use planned source repositories and paths.
# Update each source app before switching its caller to the shared web workflow.
# TVA builds the calling repository; repository below selects the promotion source.
# Store secret names here; keep credential values in Actions secrets.
# Optional values and secret_values inherit defaults → app → environment → target.
# Optional production_targets belong to each app; omit for one default Production deployment.
# vx-bot/INFO: Optional per-app promotion_path skips stages, e.g. [tva, preview, production].
# Omit promotion_path to keep the full TVA → Dev → QA → Preview → Production order.
# Omit schedule to inherit defaults.schedule; a complete app rule replaces the cadence.
# Examples: {frequency: daily}, {frequency: monthly, day: 1}, {enabled: false}.

apps:
  school-os:
    repository: vezham/vx-fe-apps-business
    path: apps/school-os
    credential_secrets:
      tva: PLAYGROUND_DOCS_TVA_GCP_SA_KEY
      dev: PLAYGROUND_DOCS_TVA_GCP_SA_KEY
      qa: PLAYGROUND_DOCS_TVA_GCP_SA_KEY
      preview: PLAYGROUND_DOCS_TVA_GCP_SA_KEY
      production: PLAYGROUND_DOCS_TVA_GCP_SA_KEY
    # values:
    #   V_BASE_API_URL: api
    #   V_MOCK_API_URL: ''
    #   V_APP_API_URL: ''

  books:
    repository: vezham/vx-fe-apps
    path: apps/books
    credential_secrets:
      tva: APPS_BOOKS_TVA_GCP_SA_KEY
      dev: APPS_BOOKS_DEV_GCP_SA_KEY
      qa: APPS_BOOKS_QA_GCP_SA_KEY
      preview: APPS_BOOKS_PREVIEW_GCP_SA_KEY
      production: APPS_BOOKS_LIVE_GCP_SA_KEY
    values:
      V_BASE_API_URL: api
      V_MOCK_API_URL: ''
      V_APP_API_URL: ''

  demo:
    repository: vezham/vx-fe-apps
    path: apps/demo
    credential_secrets:
      tva: PLAYGROUND_DOCS_TVA_GCP_SA_KEY
      dev: PLAYGROUND_APP_DEV_GCP_SA_KEY
      qa: PLAYGROUND_APP_QA_GCP_SA_KEY
      preview: PLAYGROUND_APP_PREVIEW_GCP_SA_KEY
      production: PLAYGROUND_APP_LIVE_GCP_SA_KEY

apps-cdns:
